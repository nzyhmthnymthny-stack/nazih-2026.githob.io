<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا - مطعم السرايا الفاخر</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">
                <h2>السرايا الفاخر</h2>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="services.html">قائمة الطعام</a></li>
                <li><a href="contact.html" class="active">تواصل معنا</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- [شرط الـ Contact Form للمشروع] -->
        <section class="contact-section">
            <h2>يسعدنا تواصلكم معنا</h2>
            <p style="margin-bottom: 30px; color: #666;">يمكنكم استخدام الاستمارة أدناه لحجز مسبق لطاولتكم أو لإرسال ملاحظاتكم وسنسعد بالرد الفوري.</p>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">الاسم الكامل:</label>
                    <input type="text" id="name" name="name" required placeholder="أدخل اسمك الثلاثي">
                </div>
                <div class="form-group">
                    <label for="email">البريد الإلكتروني:</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="message">تفاصيل الحجز أو رسالتك:</label>
                    <textarea id="message" name="message" rows="5" required placeholder="اكتب تفاصيل طلبك أو استفسارك هنا..."></textarea>
                </div>
                <button type="submit" class="btn">إرسال الطلب الآن</button>
            </form>
        </section>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - مطعم السرايا الفاخر | تصميم الطالب: نزيه الذيب</p>
    </footer>

</body>
</html>
